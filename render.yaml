# Render.com blueprint — deploys the backend as a free Web Service.
# Connect this repo at https://dashboard.render.com → New → Blueprint.
services:
  - type: web
    name: scanner-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CORS_ORIGIN
        sync: false   # set this in the Render dashboard to your frontend URL
